name: Android build

# Every push to main builds a signed APK (downloadable from the run's artifacts).
# Pushing a tag like v1.0.0 also publishes it as a GitHub Release, which is the install link:
#   https://github.com/kylediaslobo/ReceiptScanner/releases/latest/download/ReceiptScanner.apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.${GITHUB_RUN_NUMBER}-dev" >> "$GITHUB_ENV"
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not set; the APK will be unsigned and can't be installed."
          fi

      - name: Check release configuration
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_ANON_KEY" ] && missing="$missing SUPABASE_ANON_KEY"
          [ -z "$RELEASE_KEYSTORE_PATH" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Build APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon testReleaseUnitTest assembleRelease

      - name: Rename APK
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" ReceiptScanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ReceiptScanner-${{ env.VERSION_NAME }}
          path: ReceiptScanner.apk

      # A claim form written by the unit tests, for checking the Excel layout without a phone.
      - uses: actions/upload-artifact@v4
        with:
          name: sample-claim-form
          path: app/build/sample-claim-form.xlsx

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ReceiptScanner.apk \
            --title "Receipt Scanner $VERSION_NAME" \
            --notes "Install on Android: open this page on your phone, download ReceiptScanner.apk, and allow installing from your browser when asked."
